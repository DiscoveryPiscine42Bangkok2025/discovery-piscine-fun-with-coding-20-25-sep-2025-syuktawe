<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tab</title>
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
    }
    td {
      width: 50%;
      height: 100px;
      text-align: center;
      vertical-align: middle;
      font-size: 1.5em;
    }
    .cell1 {
      background-color: #a7c36b; /* เขียวอ่อน */
    }
    .cell2 {
      background-color: #f4b7a1; /* ชมพูพีช */
    }
  </style>
</head>
<body>
  <table border="1">
    <tr>
      <td class="cell1">First cell</td>
      <td class="cell2">Second cell</td>
    </tr>
  </table>
</body>
</html>
