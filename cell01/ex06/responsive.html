<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Table</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: auto; /* ปรับขนาดตามเนื้อหา */
  }

  th, td {
    border: 1px solid #333;
    padding: 8px;
    text-align: center;
    word-wrap: break-word;
  }

  /* ทำให้ responsive ในหน้าจอเล็ก */
  @media (max-width: 600px) {
    th, td {
      padding: 4px;
      font-size: 12px;
    }
  }

</style>
</head>
<body>
  <table>
    <tr>
      <th>Header 1</th>
      <th>Header 2</th>
      <th>Header 3</th>
      <th>Header 4</th>
    </tr>
    <tr>
      <td>Data 1</td>
      <td>Data 2</td>
      <td>Data 3</td>
      <td>Data 4</td>
    </tr>
    <tr>
      <td>Data 5</td>
      <td>Data 6</td>
      <td>Data 7</td>
      <td>Data 8</td>
    </tr>
  </table>
</body>
</html>
